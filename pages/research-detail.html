<!DOCTYPE html>
<html lang="en" data-root="../">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research — LEAP</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>

  <div id="nav-placeholder"></div>

  <header class="page-header" id="detail-header">
    <div class="container">
      <div class="page-header-inner" id="detail-header-inner">
        <div class="loading-spinner"><div class="spinner-ring"></div></div>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="detail-layout" id="detail-layout" style="display:none;">
        <div class="detail-body" id="detail-body"></div>
        <aside class="detail-sidebar" id="detail-sidebar"></aside>
      </div>
      <div id="detail-error" style="padding:2rem 0; display:none;">
        <p style="color:var(--color-text-muted);">This paper could not be loaded.</p>
        <a href="research.html" class="btn btn-outline" style="margin-top:1rem;">All Research</a>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="../js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const id     = params.get('id');
      const layout = document.getElementById('detail-layout');
      const errEl  = document.getElementById('detail-error');
      const headerInner = document.getElementById('detail-header-inner');

      if (!id) { showErr(); return; }

      try {
        const resp = await fetch(`${getSiteRoot()}data/research/${id}.json`);
        if (!resp.ok) throw new Error();
        const item = await resp.json();

        document.title = `${item.title} — LEAP`;

        const byline = item.authors ? item.authors.join(', ') : '';

        headerInner.innerHTML = `
          <a href="research.html" class="btn btn-ghost-light" style="margin-bottom:1.5rem; font-size:0.8125rem;">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 7H2M6.5 2.5 2 7l4.5 4.5"/>
            </svg>
            All Research
          </a>
          <h1 class="page-title">${escHtml(item.title)}</h1>
          ${byline ? `<p class="page-subtitle" style="margin-top:0.5rem;">${escHtml(byline)}${item.year ? ` · ${item.year}` : ''}</p>` : ''}
        `;

        renderDetailBody(item.body || [], document.getElementById('detail-body'));

        // Sidebar
        const sidebar = document.getElementById('detail-sidebar');
        const doiSection = item.doi && item.doi !== '#' ? `
          <a href="${escHtml(item.doi)}" class="btn btn-primary" style="width:100%;justify-content:center;margin-bottom:0.75rem;" target="_blank" rel="noopener">
            View full paper
          </a>` : '';

        sidebar.innerHTML = `
          <div class="sidebar-card">
            ${doiSection}
            <p class="sidebar-card-title">Publication details</p>
            <div class="sidebar-meta-row">
              ${item.year ? `<div class="sidebar-meta-item"><span class="sidebar-meta-label">Year</span><span class="sidebar-meta-value">${escHtml(String(item.year))}</span></div>` : ''}
              ${item.journal ? `<div class="sidebar-meta-item"><span class="sidebar-meta-label">Journal</span><span class="sidebar-meta-value">${escHtml(item.journal)}</span></div>` : ''}
              ${item.affiliation ? `<div class="sidebar-meta-item"><span class="sidebar-meta-label">Affiliation</span><span class="sidebar-meta-value">${escHtml(item.affiliation)}</span></div>` : ''}
              ${item.authors && item.authors.length ? `<div class="sidebar-meta-item"><span class="sidebar-meta-label">Authors</span><span class="sidebar-meta-value">${escHtml(item.authors.join(', '))}</span></div>` : ''}
            </div>
            ${(item.tags||[]).length ? `
              <p class="sidebar-card-title" style="margin-top:0.75rem;">Topics</p>
              <div class="sidebar-tags">
                ${item.tags.map(t => `<span class="card-tag">${escHtml(formatTag(t))}</span>`).join('')}
              </div>
            ` : ''}
          </div>
        `;

        layout.style.display = '';
      } catch (e) {
        showErr();
      }

      function showErr() {
        headerInner.innerHTML = '<h1 class="page-title">Paper not found</h1>';
        errEl.style.display = '';
      }
    });
  </script>
</body>
</html>
