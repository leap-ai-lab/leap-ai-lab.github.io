<!DOCTYPE html>
<html lang="en" data-root="../">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Resources — LEAP</title>
  <meta name="description" content="Lesson plans, activities, and materials for teaching AI literacy in high school and college classrooms.">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>

  <div id="nav-placeholder"></div>

  <header class="page-header">
    <div class="container">
      <div class="page-header-inner">
        <h1 class="page-title">Classroom Resources</h1>
        <p class="page-subtitle">Lesson plans, discussion activities, and multi-day units for teaching AI literacy in grades 9–16. All materials are freely available and adaptable.</p>
      </div>
    </div>
  </header>

  <div class="filter-bar" id="filter-bar">
    <div class="container filter-bar-inner">
      <span class="filter-label">Filter by:</span>
      <div class="filter-tags" id="filter-tags" role="group" aria-label="Filter resources by tag"></div>
      <button class="filter-clear" id="filter-clear" aria-label="Clear all filters">Clear filters</button>
    </div>
  </div>

  <main>
    <div class="container cards-section">
      <div class="cards-grid" id="cards-grid" role="list" aria-live="polite" aria-label="Classroom resources">
        <!-- Skeleton cards rendered by JS on load -->
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="../js/main.js"></script>
  <script>
    // List all classroom resource JSON files here. Add new files to this array.
    const RESOURCE_FILES = [
      'cr-001.json',
      'cr-002.json'
    ];

    document.addEventListener('DOMContentLoaded', async () => {
      const grid = document.getElementById('cards-grid');
      showSkeletonCards(grid, RESOURCE_FILES.length || 6);

      try {
        const items = await loadItems('resources', RESOURCE_FILES);
        grid.innerHTML = '';

        // Collect tags and render filters
        const allTags = collectAllTags(items);
        initFilters('filter-bar', 'cards-grid', allTags, items);

        // Render cards
        items.forEach(item => {
          const card = renderCard(item, 'resource-detail.html');
          card.setAttribute('role', 'listitem');
          grid.appendChild(card);
        });

        if (items.length === 0) {
          showError(grid, 'No resources found. Check back soon.');
        }
      } catch (e) {
        showError(grid, 'Could not load resources. Please try refreshing.');
      }
    });
  </script>
</body>
</html>
