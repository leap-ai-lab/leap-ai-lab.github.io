<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources - LEAP</title>
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>
    <div id="header"></div>

    <main class="main-content">
        <div class="content-container wide-container">
            <h1>Resources</h1>
            <p class="page-description">Explore our collection of lesson plans and educational resources.</p>
            
            <!-- Filter Component -->
            <div class="filter-container">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="technical">Technical</button>
                <button class="filter-btn" data-filter="socio-ethical">Socio-Ethical</button>
                <button class="filter-btn" data-filter="career-development">Career Development</button>
            </div>

            <!-- Lesson Cards Container -->
            <div class="cards-container" id="cardsContainer">
                <!-- Cards will be dynamically loaded from lessons.json -->
            </div>
            
            <!-- Loading indicator -->
            <div id="loadingIndicator" class="loading-indicator">
                <p>Loading lessons...</p>
            </div>
            
            <!-- Error message -->
            <div id="errorMessage" class="error-message" style="display: none;">
                <p>Failed to load lessons. Please try again later.</p>
            </div>
        </div>
    </main>

    <script src="../scripts/filter.js"></script>
</body>
</html>

<script>
fetch("header.html")
  .then(res => res.text())
  .then(html => {
    document.getElementById("header").innerHTML = html;
  });
</script>
