<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson - LEAP</title>
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>
    <div id="header"></div>

    <main class="main-content">
        <div class="content-container">
            <div id="loadingIndicator" class="loading-indicator">
                <p>Loading lesson...</p>
            </div>

            <div id="errorMessage" class="error-message" style="display: none;">
                <p>Lesson not found. <a href="resources.html">Return to Resources</a></p>
            </div>

            <article id="lessonContent" style="display: none;">
               <!-- Lesson header section -->
                <div class="lesson-header">
                <a href="resources.html" class="back-link">← Back to Resources</a>
                <h1 id="lessonTitle"></h1>
                <div class="lesson-meta">
                    <span id="publicationDate" class="meta-item"></span>
                    <span id="lessonDuration" class="meta-item"></span>
                    <span id="lessonCategory" class="meta-item tag"></span>
                </div>
                <p id="lessonOverview" class="lesson-overview"></p>

                 <div class="download-buttons" id="downloadButtons"></div>

                </div>

                <!-- Grid: Objectives + Outline side-by-side -->
                <section class="lesson-grid">
                <!-- Key Learning Objectives -->
                <div class="lesson-panel">
                    <h2>Key Learning Objectives</h2>
                    <ul id="learningObjectives" class="objectives-list"></ul>
                </div>

                <!-- Lesson Outline -->
                <div class="lesson-panel">
                    <h2>Lesson Outline</h2>
                    <div id="lessonOutline" class="outline-container"></div>
                </div>
                </section>

            </article>
        </div>
    </main>

    <script src="../scripts/lesson.js"></script>
</body>
</html>

<script>
fetch("header.html")
  .then(res => res.text())
  .then(html => {
    document.getElementById("header").innerHTML = html;
  });
</script>
